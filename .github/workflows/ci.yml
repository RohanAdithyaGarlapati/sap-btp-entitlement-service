name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile CDS model (OData V4 metadata)
        run: npx cds compile srv -s EntitlementService --to edmx > /dev/null

      - name: Deploy schema + seed data to SQLite
        run: npx cds deploy --to sqlite:db/ci.db

      - name: Production build (MTA inputs)
        run: npx cds build --production
